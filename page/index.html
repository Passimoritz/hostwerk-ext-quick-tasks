<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    .tools { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; margin-top: var(--sp-3); }
    .tools .input { flex: 1 1 240px; }
    .tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-3); }
    .task { gap: var(--sp-2); }
    .task[data-state="error"] { border-color: var(--err); }
    .task[data-state="running"] { border-color: var(--warn); }
    .task-result { display: flex; gap: var(--sp-1); min-width: 0; }
    .pin { min-width: var(--control-h-sm); }
  </style>
</head>
<body>
  <p class="muted" data-i18n="sub"></p>
  <div class="tools">
    <input class="input" id="search" type="search" data-i18n-placeholder="search" aria-label="Search" autocomplete="off">
    <span class="small muted" id="count" aria-live="polite"></span>
  </div>
  <div class="tasks" id="grid"><div class="hw-skeleton" style="height:110px"></div></div>
  <script src="live.js"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
